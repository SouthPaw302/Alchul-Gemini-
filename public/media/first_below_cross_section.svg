<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Alchul: First Below, two-scale conceptual Late Cretaceous margin cross-section</title>
<desc id="desc">Upper panel depicts an unscaled northwestern Ozark Paleozoic carbonate margin grading toward a southeast Mississippi Embayment Cretaceous sediment wedge. Lower panel shows a deliberately hypothetical spring-margin chamber with independent air routes to be tested, groundwater flow, and a proposed elevated nursery. Neither panel maps a real ancient cave.</desc>
